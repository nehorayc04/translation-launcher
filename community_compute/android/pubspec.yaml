name: community_compute
description: תרומת כוח-תרגום לקהילה — worker אנדרואיד
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2       # Android Keystore-backed encrypted key storage
  shared_preferences: ^2.3.2           # persistent offline buffer + settings
  flutter_foreground_task: ^8.17.0     # keep the pull-loop alive in the background
  wakelock_plus: ^1.2.8
  url_launcher: ^6.3.0                  # open a provider's site for the key guide
  webview_flutter: ^4.10.0             # the in-app "דפדפן" tab (the project's website)

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: Heebo
      fonts:
        - asset: assets/fonts/Heebo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Heebo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Heebo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Heebo-Black.ttf
          weight: 900
