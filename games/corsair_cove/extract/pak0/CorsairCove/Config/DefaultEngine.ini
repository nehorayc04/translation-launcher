[SystemSettings]
s.EnforcePackageCompatibleVersionCheck=False
pcg.DisablePCGWorldActor=true
pcg.PIE.RebuildLandscapeOnPIE=false
Interchange.FeatureFlags.Import.FBX=false
WidgetComponent.UseAutomaticTickModeByDefault=1
AllowVirtualKeyboard=true

[/Script/BuildSettings.BuildSettings]
DefaultGameTarget=CorsairCove

[Core.System]
ZeroEngineVersionWarning=False

[Core.Log]
LogStreamlineRHI=Display

[/Script/Engine.RendererSettings]
r.NGX.Enable=True
r.NGX.LogLevel=0
r.NGX.DLSS.Enable=False
r.NGX.DLSS.AutoExposure=False
r.NIS.Enable=False
t.Streamline.Reflex.EnableInEditor=False ; Better not bring more instability to the editor
t.Streamline.Reflex.HandleMaxTickRate=False ; Allows usage of FrameLimit CVar instead of ignoring it
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.AllowStaticLighting=False
r.VirtualTextures=True
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.AutoExposure.Bias=0.000000
r.DefaultFeature.AntiAliasing=1
r.DefaultFeature.MotionBlur=False
r.MinScreenRadiusForLights=0.010000
r.SupportSkyAtmosphereAffectsHeightFog=True
r.GenerateMeshDistanceFields=False
r.AntiAliasingMethod=2
r.Shadow.Virtual.Enable=1
r.Shadow.Virtual.ResolutionLodBiasDirectional=0 ; PC defaults it to -1.5 via scalabitity settings, this aligns it the same for every platforms to be 0
r.Shadow.Virtual.ResolutionLodBiasDirectionalMoving=0 ; PC defaults it to -1.5 via scalabitity settings, this aligns it the same for every platforms to be 0
r.SkyLight.RealTimeReflectionCapture.TimeSlice=0 ;if this becomes a big performance impact then it can be a scalability thing in the future
r.Lumen.Supported=0
r.MeshCardRespresentation=0 ; Although Lumen is not used in project (see above CVar), Lumen Mesh Cards can still be built if this is enabled...
r.ScreenPercentage.Default.Desktop.Mode=0 ; Manual Settings as BasedOnDesktopResolution is leading to lerp the result between Min and Max
r.DynamicRes.OperationMode=0 ; No Dynamic Resolution
r.SkinCache.CompileShaders=True
r.SkinCache.DefaultBehavior=1
r.CustomDepth=3
grass.Enable=0 ; Unless we start using the landscape Grass system...it should be disabled as it also has editor performance impact
r.DontLimitOnBattery=1 ; when set to 0, it would enforce 60fps. We have framerate limit as user option and devices like steam deck can also come with their own frame limiter more conveniently if user wants
r.Shadow.Virtual.Clipmap.LastLevel=19
r.Shadow.NaniteLODBias=0
r.Decal.FadeScreenSizeMult=0.1 ; Culls decals once they reach a small screensize, the default value is way too high and in practice never culls them. There is a fade transition so its barely noticeable.
r.HairStrands.Simulation=0 ; Due to nature of slo-mo Event Scene camera movements, there is no need for any simulations.
r.UseClusteredDeferredShading=1 ; Since we use Local Lights in Event Scenes, this optimization is necessary for batching the light draw calls and gaining performance.
mass.RuntimeSystemsEnabled=0 ; we don't use MASS and it auto-creates subsystems which takes away CPU time and increases load time of a map
r.HairStrands.Shadow.CastShadowWhenNonVisible=0
r.HairStrands.BoundMode=0 ; Simply use the Groom Bounds for Hair Optimisation (little more aggressive for LODs) since most should be attached to bones.
r.HairStrands.Voxelization.Virtual.VoxelWorldSize=0.6 ; Better base for Hair Quality settings
r.HairStrands.Voxelization.Virtual.VoxelPageResolution=32 ; Better base for Hair Quality settings
r.HairStrands.Voxelization.Virtual.VoxelPageCountPerDim=14 ; Better base for Hair Quality settings
r.Shadow.Virtual.OnePassProjection.MaxLightsPerPixel=8 ; Setting to 8 optimizes the type of buffer needed for the VSM ShadowMask. This reduces the pressure on the GPU!
r.HairStrands.Strands.BulkData.AsyncLoading=7 ;LOD7 should cover all LODs for our Groom Components
r.HairStrands.Cards.BulkData.AsyncLoading=7
r.HairStrands.DOFDepth=0 ; Grooms don't look good with DOF otherwise!

